# IDE-01: the IntelliJ IDEA the plugin compiles against. 2026.1 runs on Java 21.
platformVersion = 2026.1.5
pluginVersion = 0.3.0

# The IntelliJ Platform bundles the Kotlin standard library, so the plugin does not ship its own.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true

# Gradle builds with the installed JDK 21 and never downloads one.
org.gradle.java.installations.auto-download = false
