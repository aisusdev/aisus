<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 500px; background: transparent; }
  body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #333; font-size: 13px; position: relative; }
  .win { position: absolute; top: 0; left: 0; width: 500px; border: 1px solid #c8c8c8; border-radius: 10px; background: #fff; overflow: hidden; display: flex; flex-direction: column; }
  .title { height: 26px; flex: none; background: #ececec; border-bottom: 1px solid #d6d6d6; display: flex; align-items: center; justify-content: center; position: relative; }
  .dots { position: absolute; left: 10px; top: 7px; display: flex; gap: 7px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .tabs { height: 30px; flex: none; background: #f3f3f3; border-bottom: 1px solid #e0e0e0; display: flex; }
  .tab { background: #fff; padding: 6px 10px; border-top: 2px solid #1f6fd6; border-right: 1px solid #e0e0e0; height: 31px; }
  .canvas { flex: none; position: relative; }
  .bar { height: 22px; flex: none; background: #f3f3f3; border-top: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; font-size: 12.5px; }
  .bar b { font-weight: 600; }
  svg text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .halo { stroke: #f6f7f9; stroke-width: 3.5px; stroke-linejoin: round; paint-order: stroke; }
</style>
</head>
<body>
<div class="win">
  <div class="title"><div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>aisus</div>
  <div class="tabs"><div class="tab">Plan: Invoice export to PDF</div></div>
  <div class="canvas"><svg id="d" width="498" viewBox="0 0 498 400"></svg></div>
  <div class="bar"><span>invoice-app</span><span>aisus: <b style="color:#1f7a35">2 new</b>, <b style="color:#b06d00">2 changed</b>, <b style="color:#8e8e8e">2 removed</b></span></div>
</div>
<script>
// The flow GET /invoices/:id/export in the sample repository invoice-app,
// drawn as the plan in specs/pdf-export.md leaves it.
const P = [
  { id: "web", label: "Browser", sub: "customer", fill: "#ececee", stroke: "#6b6b70" },
  { id: "routes", label: "routes.ts", sub: "handle()", fill: "#e5f1e6", stroke: "#2e8a45" },
  { id: "inv", label: "invoices.ts", sub: "exportInvoice()", fill: "#e5f1e6", stroke: "#2e8a45" },
  { id: "db", label: "db.ts", sub: "findInvoice()", fill: "#efe6f8", stroke: "#7d3fc2" },
  { id: "csv", label: "csv.ts", sub: "toCsv()", fill: "#f1f1f1", stroke: "#9a9a9a", state: "removed" },
  { id: "pdf", label: "pdf.ts", sub: "renderPdf()", fill: "#e5f1e6", stroke: "#1f7a35", state: "new" },
];
const X = {}; P.forEach((p, i) => (X[p.id] = 46 + i * 81));

// call or reply, from, to, label, state, note
const phases = [
  ["Handle the request", [
    ["call", "web", "routes", "GET /invoices/42/export"],
    ["call", "routes", "inv", "exportInvoice(42)"],
  ]],
  ["Build the file", [
    ["call", "inv", "db", "findInvoice(42)"],
    ["reply", "db", "inv", "invoice"],
    ["call", "inv", "csv", "toCsv(invoice)", "removed", "cites invoices.ts:6"],
    ["reply", "csv", "inv", "CSV text", "removed"],
    ["call", "inv", "pdf", "renderPdf(invoice)", "new", "cites pdf-export.md:6"],
    ["reply", "pdf", "inv", "PDF bytes", "new"],
  ]],
  ["Reply", [
    ["reply", "inv", "routes", "PDF bytes", "changed", "was CSV text"],
    ["reply", "routes", "web", "200 application/pdf", "changed", "was text/csv"],
  ]],
];

const S = {
  plain: { line: "#2b2b2b", text: "#2b2b2b", width: 1 },
  reply: { line: "#8a8a8a", text: "#6d6d6d", width: 1 },
  new: { line: "#1f8a3b", text: "#17692d", width: 2, pill: "#d3ecd8" },
  changed: { line: "#d08a00", text: "#9a5d00", width: 2, pill: "#fbe7c2" },
  removed: { line: "#b3b3b3", text: "#9a9a9a", width: 1.2, pill: "#ececec" },
};

const svg = document.getElementById("d");
const NS = "http://www.w3.org/2000/svg";
function make(tag, attrs, text) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  return n;
}
const defs = make("defs", {});
for (const [key, s] of Object.entries(S)) {
  for (const open of [0, 1]) {
    const m = make("marker", { id: `m-${key}-${open}`, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto" });
    m.append(make("path", open ? { d: "M1 1L9 5L1 9", fill: "none", stroke: s.line, "stroke-width": 1.5 } : { d: "M0 0L10 5L0 10z", fill: s.line }));
    defs.append(m);
  }
}
svg.append(defs);
const layer = {};
for (const name of ["bands", "lines", "acts", "msgs", "heads"]) svg.append((layer[name] = make("g", {})));
const add = (name, tag, attrs, text) => layer[name].appendChild(make(tag, attrs, text));

function pill(cx, y, state, note) {
  const s = S[state];
  const g = layer.msgs.appendChild(make("g", {}));
  const t = g.appendChild(make("text", { x: 0, y: y + 3.2, "font-size": 9, "font-weight": 600, fill: s.text, "text-anchor": "middle" }, state));
  const w = t.getBBox().width + 10;
  let n = null, nw = 0;
  if (note) {
    n = g.appendChild(make("text", { y: y + 3.2, "font-size": 9, fill: s.text, class: "halo" }, note));
    nw = n.getBBox().width + 5;
  }
  const left = cx - (w + nw) / 2;
  g.insertBefore(make("rect", { x: left, y: y - 6, width: w, height: 12, rx: 6, fill: s.pill }), t);
  t.setAttribute("x", left + w / 2);
  if (n) n.setAttribute("x", left + w + 5);
}

const HEAD_Y = 22, HEAD_H = 32, LEFT = 6, RIGHT = 492;
let y = HEAD_Y + HEAD_H + 12;
const openAct = {};
const acts = [];

for (const [title, rows] of phases) {
  const top = y;
  y += 30;
  for (const [kind, a, b, label, state, note] of rows) {
    const style = S[state ?? (kind === "reply" ? "reply" : "plain")];
    const dir = X[b] > X[a] ? 1 : -1;
    const x1 = X[a] + 3 * dir, x2 = X[b] - 3 * dir;
    const reply = kind === "reply";
    if (!reply && openAct[b] === undefined && b !== "web") openAct[b] = { y: y - 4, state: state ?? P.find((p) => p.id === b).state };
    add("msgs", "line", { x1, y1: y, x2, y2: y, stroke: style.line, "stroke-width": style.width, "stroke-dasharray": state === "new" ? "6 3" : reply ? "3 3" : "none", "marker-end": `url(#m-${state ?? (reply ? "reply" : "plain")}-${reply ? 1 : 0})` });
    const t = add("msgs", "text", { x: (x1 + x2) / 2, y: y - 5, "font-size": 9.5, fill: style.text, "text-anchor": "middle", "font-weight": state && state !== "removed" ? 600 : 400, class: "halo" }, label);
    if (state === "removed") {
      const box = t.getBBox();
      add("msgs", "line", { x1: box.x, y1: box.y + box.height / 2 + 0.5, x2: box.x + box.width, y2: box.y + box.height / 2 + 0.5, stroke: style.text, "stroke-width": 1 });
    }
    if (reply && openAct[a]) { acts.push([a, openAct[a].y, y + 4, openAct[a].state]); delete openAct[a]; }
    if (state) { pill((x1 + x2) / 2, y + 11, state, note); y += 14; }
    y += 26;
  }
  y -= 14;
  add("bands", "rect", { x: LEFT, y: top, width: RIGHT - LEFT, height: y - top, rx: 4, fill: "#f6f7f9", stroke: "#e3e5e8" });
  add("bands", "text", { x: LEFT + 7, y: top + 13, "font-size": 10, "font-weight": 700, fill: "#5d6168" }, title);
  y += 8;
}
const END = y + 4;

for (const p of P) {
  const removed = p.state === "removed", isNew = p.state === "new";
  const g = layer.heads.appendChild(make("g", { opacity: removed ? 0.55 : 1 }));
  add("lines", "line", { x1: X[p.id], y1: HEAD_Y + HEAD_H, x2: X[p.id], y2: END, stroke: isNew ? "#7fbf8e" : "#9a9a9a", "stroke-dasharray": "3 3", opacity: removed ? 0.5 : 1 });
  g.append(make("rect", { x: X[p.id] - 37, y: HEAD_Y, width: 74, height: HEAD_H, rx: 4, fill: p.fill, stroke: p.stroke, "stroke-width": isNew ? 1.8 : 1.2, "stroke-dasharray": isNew ? "5 3" : "none" }));
  g.append(make("text", { x: X[p.id], y: HEAD_Y + 14, "font-size": 10.5, "font-weight": 700, fill: "#222", "text-anchor": "middle" }, p.label));
  g.append(make("text", { x: X[p.id], y: HEAD_Y + 26, "font-size": 8.5, fill: "#5a5a5a", "text-anchor": "middle" }, p.sub));
  if (p.state) {
    const s = S[p.state];
    const t = make("text", { x: X[p.id], y: HEAD_Y - 6.5, "font-size": 8.5, "font-weight": 600, fill: s.text, "text-anchor": "middle" }, p.state);
    g.append(t);
    const w = t.getBBox().width + 10;
    g.insertBefore(make("rect", { x: X[p.id] - w / 2, y: HEAD_Y - 15, width: w, height: 11, rx: 5.5, fill: s.pill }), t);
  }
}
for (const [p, a, b, state] of acts) {
  const part = P.find((q) => q.id === p);
  add("acts", "rect", { x: X[p] - 3, y: a, width: 6, height: b - a, fill: "#fff", stroke: part.stroke, "stroke-width": 1, "stroke-dasharray": state === "new" ? "3 2" : "none", opacity: state === "removed" ? 0.55 : 1 });
}

const H = END + 6;
svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 498 ${H}`);
const winH = 26 + 31 + H + 22 + 2;
document.querySelector(".win").style.height = winH + "px";
document.body.style.height = winH + "px";
</script>
</body>
</html>
