name: Deploy cloud

# aisus cloud deploys from main to the owner's host once the repository variable AISUS_DEPLOY is
# "true" and the secret AISUS_DEPLOY_HOOK holds the host's deploy hook. The app applies its
# database migrations when it starts, before it serves requests.
on:
  push:
    branches: [main]

jobs:
  deploy:
    if: vars.AISUS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run -w apps/cloud test
      - run: npm run -w apps/cloud build
      - name: Deploy
        env:
          DEPLOY_HOOK: ${{ secrets.AISUS_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$DEPLOY_HOOK"
