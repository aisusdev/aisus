# Publishes .report/ to GitHub Pages at https://aisusdev.github.io/aisus/.
# The standalone report that .report/standalone.mjs writes loads its images and live maps from there.
name: report-pages

on:
  push:
    branches: [main]
    paths: [".report/**", ".github/workflows/report-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .report
      - id: deploy
        uses: actions/deploy-pages@v4
